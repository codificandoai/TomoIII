name: GPU Usage Monitor - Release
on:
  release:
    types:
      - created

permissions:
  contents: read
  packages: write

env:
  HELM_REGISTRY: "ghcr.io/nvidia/gpu-usage-monitor"

jobs:
  build-and-push:
    name: Build & Push Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract package version
        run: |
          PACKAGE_VERSION=${GITHUB_REF_NAME}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo $PACKAGE_VERSION

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build helm chart
        run: |
          helm dependency build .
          helm package . -d ./charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION

      - name: Push Helm Chart to GHCR
        run: |
          helm push ./charts/gpu-usage-monitor-$PACKAGE_VERSION.tgz oci://${{ env.HELM_REGISTRY }}
