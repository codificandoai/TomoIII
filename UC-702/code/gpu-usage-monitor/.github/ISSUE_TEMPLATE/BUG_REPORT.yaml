name: Bug Report
description: Report a bug or issue with the GPU Usage Monitor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Please describe the bug in detail. What did you expect to happen versus what actually happened?
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue? Please provide step-by-step instructions.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of issue is this?
      options:
        - Dashboard Panel Issue
        - Installation Issue
        - Performance Issue
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (Required for Dashboard Panel Issues)
      description: |
        If this is a dashboard panel issue, please attach a screenshot showing the problem.
        Drag and drop images here or click to upload.
      placeholder: Paste or drag screenshot here...

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide information about your environment
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14.0, Windows 11]
        - GPU: [e.g., NVIDIA RTX 3090, AMD RX 7900 XTX]
        - Kubernetes Version: [e.g., 1.20.0]
        - Helm Version: [e.g., 3.10.0]
        - GPU Usage Monitor Version: [e.g., 0.1.0]
        - DCGM Exporter Version: [e.g., 2.1.0]
        - kube-state-metrics Version: [e.g., 2.1.0]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Please paste any relevant logs, error messages, or stack traces
      placeholder: Paste logs here...
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here
      placeholder: Any additional information that might help...
