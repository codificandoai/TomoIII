global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "uc129_resilience_metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["uc129-api:8002"]
        labels:
          service: "uc-129-resilience-metrics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
