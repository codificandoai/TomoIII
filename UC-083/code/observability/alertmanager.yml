global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@trackprice.ai'

route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'pipeline']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: P1
        pipeline: trackprice_batch_inference
      receiver: 'pagerduty-batch'
      continue: true
    - match:
        severity: P2
        pipeline: trackprice_batch_inference
      receiver: 'slack-batch'

receivers:
  - name: 'default'
    slack_configs:
      - send_resolved: true
        title: 'UC-083 Alert'
        text: '{ range .Alerts }{ .Annotations.summary } — { .Annotations.runbook_url }{ end }'

  - name: 'slack-batch'
    slack_configs:
      - channel: '#mlops-alerts'
        send_resolved: true
        title: 'Batch Inference Alert'
        text: '{ range .Alerts }{ .Annotations.description } | runbook: { .Annotations.runbook_url }{ end }'

  - name: 'pagerduty-batch'
    pagerduty_configs:
      - service_key: '<PAGERDUTY_SERVICE_KEY>'
        severity: critical
        description: '{ range .Alerts }{ .Annotations.summary }{ end }'
