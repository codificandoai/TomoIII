server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: uc-119-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(uc119-api)"
        target_label: "job"
        replacement: "uc-119"
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            model: model
            message: message
      - labels:
          level:
          model:
