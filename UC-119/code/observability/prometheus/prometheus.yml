global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "uc119_llm_monitoring"
    metrics_path: /metrics
    static_configs:
      - targets: ["uc119-api:8000"]
        labels:
          service: "uc-119-llm-monitoring"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "envoy"
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]
