<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackPrice.ai — Pricing Digital Twin</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--card:#101d2d;--line:#25364a;--accent:#00e5a0;--text:#e6edf7;--muted:#8ba0b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#12304a,var(--bg) 38%);color:var(--text);font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.badge{color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:6px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(16,29,45,.92);border:1px solid var(--line);border-radius:14px;padding:18px}.value{font-size:28px;font-weight:700;margin-top:8px}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.agent h3{margin:0 0 8px}.muted{color:var(--muted)}button{background:var(--accent);border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}select,input{background:#081522;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px}.controls{display:flex;gap:10px;margin:22px 0}.bar{height:8px;background:#243245;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}pre{white-space:pre-wrap;max-height:260px;overflow:auto}@media(max-width:850px){.grid,.agents{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.agents{grid-template-columns:1fr}.controls{flex-direction:column}}
</style>
</head>
<body><main>
<div class="top"><div><h1>TrackPrice.ai</h1><p class="muted">Gemelo Digital de Pricing · 6 agentes sincronizados</p></div><span class="badge" id="status">API conectando…</span></div>
<div class="controls"><input id="sku" value="TRACKPRICE-WEB-001"><select id="scenario"><option>baseline</option><option>optimistic</option><option>pessimistic</option><option>competitor_shock</option><option>demand_shock</option></select><button id="run">Crear y optimizar</button></div>
<section class="grid"><div class="card"><span class="muted">Precio actual</span><div class="value" id="price">—</div></div><div class="card"><span class="muted">Precio recomendado</span><div class="value" id="recommended">—</div></div><div class="card"><span class="muted">Profit esperado</span><div class="value" id="profit">—</div></div><div class="card"><span class="muted">Confianza</span><div class="value" id="confidence">—</div></div></section>
<h2>Consejo multiagente</h2><section class="agents" id="agents"></section>
<h2>Auditoría</h2><div class="card"><pre id="audit">Ejecute el pipeline para ver el resultado verificable.</pre></div>
</main>
<script>
const $=id=>document.getElementById(id);const labels={alpha_trend:'Alpha · Tendencias',beta_competitor:'Beta · Competencia',gamma_demand:'Gamma · Demanda',delta_optimizer:'Delta · Optimización',epsilon_anomaly:'Epsilon · Anomalías',zeta_strategy:'Zeta · Estrategia'};
async function api(url,options){const r=await fetch(url,options);const j=await r.json();if(!r.ok)throw new Error(j.message||'API error');return j.data}
async function health(){try{await api('/health');$('status').textContent='API activa'}catch(e){$('status').textContent='API no disponible'}}
async function run(){try{const sku=$('sku').value;const payload={sku,current_price:249.99,unit_cost:150,competitor_price:245,current_demand:5000,inventory:50000};try{await api('/api/v1/twins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){if(!e.message.includes('already exists'))throw e}const result=await api(`/api/v1/twins/${encodeURIComponent(sku)}/optimize`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:$('scenario').value,objective:'profit',execute:false})});$('price').textContent='$'+result.state_before.current_price.toFixed(2);$('recommended').textContent='$'+result.recommendation.recommended_price.toFixed(2);$('profit').textContent='$'+Math.round(result.recommendation.expected_profit).toLocaleString();$('confidence').textContent=Math.round(result.recommendation.confidence*100)+'%';$('agents').innerHTML=result.signals.map(s=>`<article class="card agent"><h3>${labels[s.agent]}</h3><p>${s.summary}</p><div class="bar"><span style="width:${s.confidence*100}%"></span></div><small class="muted">Confianza ${Math.round(s.confidence*100)}%</small></article>`).join('');$('audit').textContent=JSON.stringify({cycle_id:result.cycle_id,audit_hash:result.audit_hash,scenario:result.scenario,guardrails:result.recommendation.guardrails},null,2)}catch(e){$('audit').textContent=e.message}}
$('run').addEventListener('click',run);health();
</script></body></html>
