server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: uc-127-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(uc127-api)"
        target_label: "job"
        replacement: "uc-127"
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
    pipeline_stages:
      - json:
          expressions:
            level: level
            incident_id: incident_id
            playbook: playbook
            message: message
      - labels:
          level:
          playbook:
