global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "uc127_incident_response"
    metrics_path: /metrics
    static_configs:
      - targets: ["uc127-api:8001"]
        labels:
          service: "uc-127-incident-response"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
