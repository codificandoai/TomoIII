groups:
  - name: uc322_conflict_resolution_alerts
    interval: 10s
    rules:
      # ALERTA: Tasa de conflictos elevada
      - alert: AltaTasaDeConflictos
        expr: |
          sum(rate(conflict_negotiation_total[5m])) +
          sum(rate(conflict_voting_total[5m])) +
          sum(rate(conflict_cnp_total[5m])) +
          sum(rate(conflict_escalation_total[5m])) > 10
        for: 2m
        labels:
          severity: warning
          team: ai-engineering
          service: uc-322
        annotations:
          summary: "Tasa de conflictos elevada en UC-322"
          description: "Más de 10 conflictos por minuto en los últimos 5 minutos. El ecosistema multiagente puede estar desestabilizado."

      # ALERTA CRÍTICA: Circuit breaker abierto
      - alert: CircuitBreakerAbierto
        expr: conflict_escalation_total{verdict="stop"} > 0
        for: 1m
        labels:
          severity: critical
          team: sre-on-call
          service: uc-322
        annotations:
          summary: "Circuit breaker abierto en UC-322"
          description: "El protocolo de escalación ha emitido un veredicto STOP. Todas las operaciones del dominio están detenidas. Requiere intervención humana inmediata."

      # ALERTA: Escalaciones frecuentes a revisión humana
      - alert: EscalacionesFrecuentesARevision
        expr: |
          sum(rate(conflict_escalation_total{verdict="review"}[10m])) > 5
        for: 5m
        labels:
          severity: warning
          team: ai-engineering
          service: uc-322
        annotations:
          summary: "Escalaciones frecuentes a revisión humana"
          description: "Más de 5 escalaciones a REVIEW en 10 minutos. Los niveles 1-3 no están resolviendo suficientes conflictos automáticamente."

      # ALERTA: Negociación nunca llega a acuerdo
      - alert: NegociacionSinAcuerdo
        expr: |
          (
            sum(rate(conflict_negotiation_total{result="no_agreement"}[15m]))
            /
            clamp_min(sum(rate(conflict_negotiation_total[15m])), 1)
          ) > 0.8
        for: 10m
        labels:
          severity: warning
          team: ai-engineering
          service: uc-322
        annotations:
          summary: "Negociación (Nivel 1) raramente llega a acuerdo"
          description: "Más del 80% de las negociaciones fracasan. Los agentes pueden tener posiciones demasiado rígidas o la configuración de concesiones necesita ajuste."

      # ALERTA: Votación sin consenso
      - alert: VotacionSinConsenso
        expr: |
          (
            sum(rate(conflict_voting_total{result="no_consensus"}[15m]))
            /
            clamp_min(sum(rate(conflict_voting_total[15m])), 1)
          ) > 0.7
        for: 10m
        labels:
          severity: warning
          team: ai-engineering
          service: uc-322
        annotations:
          summary: "Votación (Nivel 2) raramente alcanza consenso"
          description: "Más del 70% de las votaciones no alcanzan consenso. El umbral de consenso puede ser demasiado alto o las reputaciones están demasiado polarizadas."

      # ALERTA: Deadlock detectado
      - alert: DeadlockDetectado
        expr: conflict_escalation_total{verdict="stop"} > 0
        for: 30s
        labels:
          severity: critical
          team: sre-on-call
          service: uc-322
        annotations:
          summary: "Deadlock detectado en el sistema multiagente"
          description: "Se detectó un ciclo de espera entre agentes. El sistema está bloqueado. Requiere intervención inmediata para romper el ciclo."

      # ALERTA: Trabajo duplicado frecuente
      - alert: TrabajoDuplicadoFrecuente
        expr: |
          sum(rate(conflict_negotiation_total[10m])) > 3
        for: 5m
        labels:
          severity: info
          team: ai-engineering
          service: uc-322
        annotations:
          summary: "Trabajo duplicado detectado frecuentemente"
          description: "Se detectan más de 3 tareas duplicadas en 10 minutos. Los agentes no están coordinando correctamente la asignación de tareas."
