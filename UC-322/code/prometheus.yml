global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'uc322_conflict_resolution'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:5322']
        labels:
          service: 'uc-322'
          component: 'conflict-resolution'

  - job_name: 'uc322_agent_health'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'uc-322'
          component: 'agent-health'
