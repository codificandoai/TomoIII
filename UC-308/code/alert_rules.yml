groups:
  - name: uc308_agent_drift
    rules:
      - alert: UC308DriftCritical
        expr: |
          (
            uc308_run_status >= 3
            or
            uc308_success_rate < 0.6
          )
        for: 1m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308: critical agent drift or environmental degradation detected"
          description: "The UC-308 nightly run reported critical status or success rate below 60%. Manual intervention is required."

      - alert: UC308DriftDegraded
        expr: |
          (
            uc308_run_status >= 2
            or
            (uc308_success_rate < 0.8 and uc308_success_rate >= 0.6)
          )
        for: 2m
        labels:
          severity: degraded
          team: ai-operations
        annotations:
          summary: "UC-308: degraded agent performance"
          description: "The UC-308 run status is degraded or success rate is between 60% and 80%."

      - alert: UC308DriftWarning
        expr: |
          (
            uc308_run_status >= 1
            or
            (uc308_success_rate < 0.9 and uc308_success_rate >= 0.8)
            or
            (uc308_quality_score < 0.9 and uc308_quality_score >= 0.75)
          )
        for: 5m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308: early drift warning"
          description: "Early signs of drift detected; monitor closely before it escalates."

      - alert: UC308ToolOperationalLatency
        expr: |
          (
            rate(uc308_latency_seconds_sum[5m])
            /
            rate(uc308_latency_seconds_count[5m])
          ) > 2
        for: 2m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308: tool latency regression"
          description: "Average latency for tool {{ $labels.tool }} is above 2 seconds."

      - alert: UC308APIContractDrift
        expr: uc308_drift_status{drift_type="contract_api"} >= 2
        for: 1m
        labels:
          severity: degraded
          team: ai-operations
        annotations:
          summary: "UC-308: API contract drift"
          description: "Detected contract/schema drift in {{ $labels.tool }}."

      - alert: UC308HTMLInterfaceDrift
        expr: uc308_drift_status{drift_type="html_interface"} >= 2
        for: 1m
        labels:
          severity: degraded
          team: ai-operations
        annotations:
          summary: "UC-308: HTML interface drift"
          description: "Detected HTML/interface selector drift in {{ $labels.tool }}."

      - alert: UC308DataDistributionDrift
        expr: uc308_drift_score{drift_type="data_distribution"} > 0.25
        for: 2m
        labels:
          severity: degraded
          team: ai-operations
        annotations:
          summary: "UC-308: data distribution drift"
          description: "Detected data distribution shift with PSI/JS above threshold."

      - alert: UC308BehavioralDrift
        expr: uc308_drift_status{drift_type="behavioral"} >= 2
        for: 2m
        labels:
          severity: degraded
          team: ai-operations
        annotations:
          summary: "UC-308: behavioral drift"
          description: "Agent behavior (steps/retries/escalations) degraded."

      - alert: UC308CCPredictionDivergence
        expr: |
          (
            abs(uc308_cc_bid_mae{role="champion"} - uc308_cc_bid_mae{role="challenger"})
            +
            abs(uc308_cc_ask_mae{role="champion"} - uc308_cc_ask_mae{role="challenger"})
          ) > 0.05
        for: 2m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308 CC: significant prediction divergence between champion and challenger"
          description: "Bid/ask MAE difference between champion and challenger exceeds 0.05."

      - alert: UC308CCDrawdownViolation
        expr: uc308_cc_drawdown{role="challenger"} > 0.10
        for: 1m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: challenger drawdown limit exceeded"
          description: "Challenger max drawdown {{ $value }} is above the configured risk gate."

      - alert: UC308CCExposureViolation
        expr: uc308_cc_exposure{role="challenger"} > 200000
        for: 1m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: challenger exposure limit exceeded"
          description: "Challenger exposure {{ $value }} exceeded the risk limit."

      - alert: UC308CCStaleFeed
        expr: rate(uc308_cc_events_ingested_total[1m]) == 0
        for: 2m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308 CC: stale market feed"
          description: "No market events ingested in the last 2 minutes."

      - alert: UC308CCAuthorityViolation
        expr: rate(uc308_cc_authority_denials_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: authority violation detected"
          description: "A real-order authority check was denied for the challenger."

      - alert: UC308CCExperimentContained
        expr: uc308_cc_experiment_state == 9
        for: 0m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: experiment moved to contained state"
          description: "A risk gate or shutdown moved the champion/challenger experiment to contained."

      - alert: UC308CCPredictionDivergence
        expr: |
          (
            abs(uc308_cc_bid_mae{role="champion"} - uc308_cc_bid_mae{role="challenger"})
            +
            abs(uc308_cc_ask_mae{role="champion"} - uc308_cc_ask_mae{role="challenger"})
          ) > 0.05
        for: 2m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308 CC: significant prediction divergence between champion and challenger"
          description: "Bid/ask MAE difference between champion and challenger exceeds 0.05."

      - alert: UC308CCDrawdownViolation
        expr: uc308_cc_drawdown{role="challenger"} > 0.10
        for: 1m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: challenger drawdown limit exceeded"
          description: "Challenger max drawdown {{ $value }} is above the configured risk gate."

      - alert: UC308CCExposureViolation
        expr: uc308_cc_exposure{role="challenger"} > 200000
        for: 1m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: challenger exposure limit exceeded"
          description: "Challenger exposure {{ $value }} exceeded the risk limit."

      - alert: UC308CCStaleFeed
        expr: rate(uc308_cc_events_ingested_total[1m]) == 0
        for: 2m
        labels:
          severity: warning
          team: ai-operations
        annotations:
          summary: "UC-308 CC: stale market feed"
          description: "No market events ingested in the last 2 minutes."

      - alert: UC308CCAuthorityViolation
        expr: rate(uc308_cc_authority_denials_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: authority violation detected"
          description: "A real-order authority check was denied for the challenger."

      - alert: UC308CCExperimentContained
        expr: uc308_cc_experiment_state == 9
        for: 0m
        labels:
          severity: critical
          team: ai-operations
        annotations:
          summary: "UC-308 CC: experiment moved to contained state"
          description: "A risk gate or shutdown moved the champion/challenger experiment to contained."
