global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'degraded'
    equal: ['alertname']

receivers:
  - name: 'default'
    # El Alertmanager real debe configurar un webhook/email/Slack valido.
    # Este es un endpoint simulado/documental; UC-308 nunca auto-modifica.
    webhook_configs:
      - url: 'http://127.0.0.1:5308/api/v1/noop'
        send_resolved: false

  - name: 'critical'
    webhook_configs:
      - url: 'http://127.0.0.1:5308/api/v1/noop'
        send_resolved: false
